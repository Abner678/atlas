<body class="st-body">

<header class="st-top">

  <div class="st-title">赚钱的 <em>16 种逻辑</em> · 超级树</div>
  <div class="st-meta">
    <span>路径 <b data-k="methods">16</b></span>
    <span>做法 <b data-k="practices">88</b></span>
    <span>国家文件 <b data-k="policies">44</b></span>

<div class="st-bar">
  <button class="st-chip on" data-fam="">全部</button>
  <button class="st-chip" data-fam="A"><span class="dot" style="background:#d9552f"></span>勤快</button>
  <button class="st-chip" data-fam="B"><span class="dot" style="background:#2f6b4f"></span>增值</button>
  <button class="st-chip" data-fam="C"><span class="dot" style="background:#2f5d8a"></span>差异</button>
  <button class="st-chip" data-fam="D"><span class="dot" style="background:#76508a"></span>借力</button>
  <span class="st-div"></span>
  <button class="st-chip on" data-mode="logic">按逻辑</button>
  <button class="st-chip" data-mode="need">按需求</button>
  <button class="st-chip" data-mode="drive">按人性</button>
  <span class="st-sp"></span>
  <input class="st-search" id="stSearch" type="search" placeholder="搜路径 / 做法 / 职业…" autocomplete="off">
  <button class="st-act" id="stExpand" data-mode="none">重置</button>
  <button class="st-chip on" id="stLinksBtn">连接线</button>
</div>

<main class="st-stage" id="stStage">
  <div class="st-canvas" id="stCanvas">
    <svg class="st-links" id="stLinks"></svg>
    <svg class="st-edges" id="stEdges"></svg>
    <div class="st-nodes" id="stNodes"></div>
  </div>
</main>

<aside class="st-panel" id="stPanel"></aside>

<div class="st-ctrl">
  <button class="st-cbtn" id="stOut" aria-label="缩小">−</button>
  <span class="st-scale" id="stScale">100%</span>
  <button class="st-cbtn" id="stIn" aria-label="放大">＋</button>
  <button class="st-cbtn wide" id="stFit">适合屏幕</button>
</div>

<div class="st-hint">点路径卡片展开 7 个组 · 拖动画布 · 滚轮缩放 · 虚线是路径之间的连接</div>

<script src="assets/data.js"></script>
